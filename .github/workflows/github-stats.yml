name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Stats
        uses: anuraghazra/github-readme-stats@master
        with:
          username: YTFL
          show_icons: true
          theme: transparent
          hide_border: true

      - name: Push Stats
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: stats
          build_dir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
