name: Generate Snake (Alt)

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: YTFL

          # REQUIRED core config
          base: ""
          config_timezone: Asia/Kolkata

          # OUTPUT CONFIG (CRITICAL)
          filename: snake.svg
          output_action: commit
          committer_branch: snake-output

          # SNAKE PLUGIN (fully specified)
          plugin_snake: yes
          plugin_snake_animate: yes
          plugin_snake_section: contributions
          plugin_snake_color: github-dark
