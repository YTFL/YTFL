name: Generate Repo Gallery

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate gallery SVG
        run: |
          mkdir -p dist
          cat << 'EOF' > dist/repo-gallery.svg
          <svg width="840" height="260" viewBox="0 0 840 260" xmlns="http://www.w3.org/2000/svg">

          <defs>

          <linearGradient id="silverGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="220" y2="0">
          <stop offset="0%" stop-color="#E5E5E5"/>
          <stop offset="50%" stop-color="#9CA3AF"/>
          <stop offset="100%" stop-color="#E5E5E5"/>
          </linearGradient>

          <linearGradient id="purpleGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="220" y2="0">
          <stop offset="0%" stop-color="#A78BFA"/>
          <stop offset="50%" stop-color="#6D28D9"/>
          <stop offset="100%" stop-color="#A78BFA"/>
          </linearGradient>

          <linearGradient id="cyanGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="220" y2="0">
          <stop offset="0%" stop-color="#67E8F9"/>
          <stop offset="50%" stop-color="#06B6D4"/>
          <stop offset="100%" stop-color="#67E8F9"/>
          </linearGradient>

          </defs>

          <style>

          text {
            font-family: system-ui, sans-serif;
            fill: #ffffff;
          }

          .card {
            rx:14;
            cursor:pointer;
            transition: transform 0.25s ease;
          }

          .card:hover {
            transform: translateY(-8px);
          }

          .border {
            stroke-width:3;
            fill:none;
            stroke-dasharray:600;
            animation:borderMove 6s linear infinite;
          }

          @keyframes borderMove {
            from { stroke-dashoffset:0 }
            to { stroke-dashoffset:600 }
          }

          </style>

          <!-- AttendMate -->

          <a href="https://github.com/YTFL/AttendMate-Bunk-Calculator-Attendance-Tracker">

          <rect class="card" x="40" y="60" width="220" height="140" fill="#C0C0C0"/>
          <rect class="border" x="40" y="60" width="220" height="140" stroke="url(#silverGrad)"/>

          <text x="65" y="100" font-size="18">📊 AttendMate</text>
          <text x="65" y="130" font-size="13">Attendance tracker</text>
          <text x="65" y="150" font-size="13">Bunk calculator</text>

          </a>

          <!-- HonZuki -->

          <a href="https://github.com/YTFL/HonZuki-BookTracker">

          <rect class="card" x="310" y="60" width="220" height="140" fill="#6D28D9"/>
          <rect class="border" x="310" y="60" width="220" height="140" stroke="url(#purpleGrad)"/>

          <text x="335" y="100" font-size="18">📚 HonZuki</text>
          <text x="335" y="130" font-size="13">Book tracker</text>
          <text x="335" y="150" font-size="13">Reading progress</text>

          </a>

          <!-- PDFark -->

          <a href="https://github.com/YTFL/PDFark-Mode-PDF-Darkmode-Converter">

          <rect class="card" x="580" y="60" width="220" height="140" fill="#06B6D4"/>
          <rect class="border" x="580" y="60" width="220" height="140" stroke="url(#cyanGrad)"/>

          <text x="605" y="100" font-size="18">🌙 PDFark</text>
          <text x="605" y="130" font-size="13">Dark mode PDF</text>
          <text x="605" y="150" font-size="13">Comfort reading</text>

          </a>

          </svg>
          EOF

      - name: Deploy gallery
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
