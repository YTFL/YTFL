name: Generate Repo Gallery

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate gallery SVG
        run: |
          mkdir -p dist
          cat << 'EOF' > dist/repo-gallery.svg
          <svg width="840" height="260" viewBox="0 0 840 260" xmlns="http://www.w3.org/2000/svg">

          <style>

          text {
            font-family: system-ui, sans-serif;
            fill: #c9d1d9;
          }

          .card {
            rx:14;
            cursor:pointer;
            transition: transform 0.2s ease;
          }

          .card:hover {
            transform: translateY(-6px);
          }

          </style>

          <!-- AttendMate -->

          <a href="https://github.com/YTFL/AttendMate-Bunk-Calculator-Attendance-Tracker">

          <rect class="card"
          x="40" y="60"
          width="220" height="140"
          fill="#1f2428"
          stroke="#9ca3af"
          stroke-width="2"/>

          <text x="65" y="100" font-size="18">📊 AttendMate</text>
          <text x="65" y="130" font-size="13">Attendance tracker</text>
          <text x="65" y="150" font-size="13">Bunk calculator</text>

          </a>

          <!-- HonZuki -->

          <a href="https://github.com/YTFL/HonZuki-BookTracker">

          <rect class="card"
          x="310" y="60"
          width="220" height="140"
          fill="#211c2e"
          stroke="#8b5cf6"
          stroke-width="2"/>

          <text x="335" y="100" font-size="18">📚 HonZuki</text>
          <text x="335" y="130" font-size="13">Book tracker</text>
          <text x="335" y="150" font-size="13">Reading progress</text>

          </a>

          <!-- PDFark -->

          <a href="https://github.com/YTFL/PDFark-Mode-PDF-Darkmode-Converter">

          <rect class="card"
          x="580" y="60"
          width="220" height="140"
          fill="#182c2f"
          stroke="#22d3ee"
          stroke-width="2"/>

          <text x="605" y="100" font-size="18">🌙 PDFark</text>
          <text x="605" y="130" font-size="13">Dark mode PDF</text>
          <text x="605" y="150" font-size="13">Comfort reading</text>

          </a>

          </svg>
          EOF

      - name: Deploy gallery
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
