name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: YTFL
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Fix permissions
        run: chmod -R 777 dist

      - name: Force refresh (avoid stale cache)
        run: |
          echo "<!-- $(date) -->" >> dist/github-contribution-grid-snake.svg
          echo "<!-- $(date) -->" >> dist/github-contribution-grid-snake-dark.svg

      - name: Deploy to snake-output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: snake-output
          keep_files: false
