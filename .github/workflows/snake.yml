name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate blue snake (dark mode only)
        uses: Platane/snk@v3
        with:
          github_user_name: YTFL
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#58A6FF

      - name: Prepare writable files
        run: |
          mkdir -p dist-fixed
          cp dist/github-contribution-grid-snake.svg dist-fixed/

      - name: Force refresh
        run: |
          echo "<!-- $(date) -->" >> dist-fixed/github-contribution-grid-snake.svg

      - name: Deploy to snake-output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist-fixed
          publish_branch: snake-output
          keep_files: false
