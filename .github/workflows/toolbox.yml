name: Generate Toolbox Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate toolbox SVG
        run: |
          mkdir -p dist
          cat << 'EOF' > dist/toolbox.svg
          <svg width="600" height="220" viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg">

          <style>
          .tool { opacity: 0; transform: translateY(30px); animation: rise 0.8s forwards; }
          .tool1 { animation-delay: 0.5s; }
          .tool2 { animation-delay: 1.2s; }
          .tool3 { animation-delay: 1.9s; }

          @keyframes rise {
            to { opacity: 1; transform: translateY(0); }
          }

          text {
            font-family: Arial, Helvetica, sans-serif;
            fill: #c9d1d9;
          }
          </style>

          <!-- Toolbox -->
          <rect x="220" y="140" width="160" height="40" rx="8" fill="#30363d"/>
          <rect x="250" y="120" width="100" height="25" rx="5" fill="#30363d"/>

          <text x="260" y="110" font-size="16">🧰 Tools by YTFL</text>

          <!-- Tools -->
          <text class="tool tool1" x="80" y="200" font-size="16">🔧 AttendMate</text>
          <text class="tool tool2" x="250" y="200" font-size="16">📚 HonZuki</text>
          <text class="tool tool3" x="420" y="200" font-size="16">🌙 PDFark</text>

          </svg>
          EOF

      - name: Deploy SVG
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
