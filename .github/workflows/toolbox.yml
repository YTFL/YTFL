name: Generate Toolbox Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate toolbox SVG
        run: |
          mkdir -p dist
          cat << 'EOF' > dist/toolbox.svg
          <svg width="700" height="260" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">

          <style>

          text {
            font-family: system-ui, sans-serif;
            fill: #c9d1d9;
          }

          .glow {
            filter: drop-shadow(0 0 6px #58a6ff);
          }

          .tool {
            opacity: 0;
            transform: translateY(30px);
            animation: rise 1s forwards;
          }

          .t1 { animation-delay: 1.5s; }
          .t2 { animation-delay: 2.5s; }
          .t3 { animation-delay: 3.5s; }

          .lid {
            transform-origin: left center;
            animation: openLid 1s forwards;
            animation-delay: 0.5s;
          }

          @keyframes openLid {
            from { transform: rotate(0deg); }
            to { transform: rotate(-35deg); }
          }

          @keyframes rise {
            to { opacity: 1; transform: translateY(0); }
          }

          </style>

          <!-- Title -->
          <text x="260" y="40" font-size="20">🧰 Tools by YTFL</text>

          <!-- Toolbox base -->
          <rect x="240" y="160" width="220" height="60" rx="12" fill="#30363d"/>

          <!-- Toolbox lid -->
          <rect class="lid" x="240" y="130" width="220" height="40" rx="10" fill="#3a3f47"/>

          <!-- Tools -->

          <a href="https://github.com/YTFL/AttendMate-Bunk-Calculator-Attendance-Tracker">
          <text class="tool t1 glow" x="120" y="230" font-size="18">🔧 AttendMate</text>
          </a>

          <a href="https://github.com/YTFL/HonZuki-BookTracker">
          <text class="tool t2 glow" x="300" y="230" font-size="18">📚 HonZuki</text>
          </a>

          <a href="https://github.com/YTFL/PDFark-Mode-PDF-Darkmode-Converter">
          <text class="tool t3 glow" x="480" y="230" font-size="18">🌙 PDFark</text>
          </a>

          </svg>
          EOF

      - name: Deploy SVG
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
