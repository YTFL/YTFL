<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect fill="#0d1117" width="900" height="1200"/>

  <!-- Outer Border -->
  <rect x="45" y="45" width="810" height="1110" stroke="#e6edf3" stroke-width="4" fill="none" opacity="0.9"/>

  <!-- Redesigned High-Density Curly Gothic Corners -->
  <defs>
    <g id="dn-corner-dense">
      <path d="M-5 -5 L 220 -5 L 220 2 L 2 2 L 2 220 L -5 220 Z" fill="#e6edf3" opacity="0.3"/>
      <g transform="translate(10, 10)">
        <path d="M0 0 C 30 0, 45 20, 35 45 C 25 70, 0 60, 5 35 C 10 15, 35 25, 25 45" stroke="#e6edf3" fill="none" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="5" cy="5" r="4" fill="#e6edf3"/>
        <path d="M50 10 C 80 -15, 120 5, 110 40 C 100 75, 60 65, 65 45 C 70 25, 95 30, 90 55" stroke="#e6edf3" fill="none" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M120 5 C 150 -15, 190 0, 200 30 C 210 60, 180 80, 160 65 C 140 50, 160 30, 175 35" stroke="#e6edf3" fill="none" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
        <path d="M180 15 Q 210 10, 215 40 T 190 70" stroke="#e6edf3" fill="none" stroke-width="1.2" opacity="0.4" stroke-linecap="round"/>
        <path d="M10 50 C -15 80, 5 120, 40 110 C 75 100, 65 60, 45 65 C 25 70, 30 95, 55 90" stroke="#e6edf3" fill="none" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M5 120 C -15 150, 0 190, 30 200 C 60 210, 80 180, 65 160 C 50 140, 30 160, 35 175" stroke="#e6edf3" fill="none" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
        <path d="M15 180 Q 10 210, 40 215 T 70 190" stroke="#e6edf3" fill="none" stroke-width="1.2" opacity="0.4" stroke-linecap="round"/>
        <path d="M60 60 C 80 80, 110 70, 100 45 M60 60 C 40 80, 70 110, 45 100" stroke="#e6edf3" fill="none" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>
        <path d="M140 5 Q 170 -10, 190 10" stroke="#e6edf3" fill="none" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/>
        <path d="M5 140 Q -10 170, 10 190" stroke="#e6edf3" fill="none" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/>
        <path d="M105 5 L 115 -5 L 125 5 L 115 15 Z" fill="#e6edf3"/>
        <path d="M5 105 L -5 115 L 5 125 L 15 115 Z" fill="#e6edf3"/>
        <path d="M165 40 L 172 33 L 179 40 L 172 47 Z" fill="#e6edf3" opacity="0.6"/>
        <path d="M40 165 L 33 172 L 40 179 L 47 172 Z" fill="#e6edf3" opacity="0.6"/>
        <circle cx="85" cy="85" r="1.5" fill="#e6edf3" opacity="0.4"/>
      </g>
    </g>
  </defs>

  <!-- Placing Corners -->
  <g transform="translate(45, 45)"><use href="#dn-corner-dense"/></g>
  <g transform="translate(855, 45) scale(-1, 1)"><use href="#dn-corner-dense"/></g>
  <g transform="translate(45, 1155) scale(1, -1)"><use href="#dn-corner-dense"/></g>
  <g transform="translate(855, 1155) scale(-1, -1)"><use href="#dn-corner-dense"/></g>

  <!-- Header Section -->
  <g transform="translate(450, 115)">
    <g opacity="0.9" stroke="#e6edf3" stroke-width="1.2">
      <circle cx="0" cy="0" r="95" fill="none" stroke-dasharray="1,4"/>
      <line x1="0" y1="-85" x2="0" y2="-125"/><line x1="0" y1="85" x2="0" y2="125"/>
      <line x1="-85" y1="0" x2="-125" y2="0"/><line x1="85" y1="0" x2="125" y2="0"/>
      <line x1="60" y1="60" x2="88" y2="88"/><line x1="-60" y1="-60" x2="-88" y2="-88"/>
      <line x1="60" y1="-60" x2="88" y2="-88"/><line x1="-60" y1="60" x2="-88" y2="88"/>
    </g>
    <!-- Background circle matches .bg color #0d1117 -->
    <circle cx="0" cy="0" r="80" fill="#0d1117" stroke="#e6edf3" stroke-width="4"/>
    <!-- Reverted back to the Skull silhouette -->
    <text y="28" text-anchor="middle" fill="#e6edf3" style="font-size: 90px;">☠</text>
  </g>

  <!-- Titles with Inline Styles and Fallback Font Stack -->
  <text x="450" y="290" text-anchor="middle" fill="#e6edf3" style="font-family: 'UnifrakturCook', 'Old English Text MT', 'Engravers Old English', 'Apple Chancery', 'cursive', serif; font-size: 68px; letter-spacing: 14px;">WHO AM I</text>
  <text x="450" y="345" text-anchor="middle" fill="#e6edf3" style="font-family: 'UnifrakturCook', 'Old English Text MT', serif; font-size: 36px;">YTFL</text>

  <!-- Rules List -->
  <g transform="translate(185, 430)" fill="#e6edf3">
    <g style="font-family: 'UnifrakturCook', 'Old English Text MT', serif; font-size: 20px; letter-spacing: 0.5px;">
      
      <text dy="0">
        <tspan x="0">◦ I construct structured, logic-driven solutions to address real-world</tspan>
        <tspan x="0" dy="24">problems with efficiency.</tspan>
        <tspan x="0" dy="28" fill="#8b949e" opacity="0.7" style="font-family: 'Noto Serif JP', 'MS PMincho', 'serif'; font-size: 15px;">現実の問題を効率的に解決するため、構造化された論理駆動型ソリューションを構築する。</tspan>
      </text>

      <text y="95">
        <tspan x="0">◦ I operate within automation systems, decision engines, and</tspan>
        <tspan x="0" dy="24">productivity-oriented workflows.</tspan>
        <tspan x="0" dy="28" fill="#8b949e" opacity="0.7" style="font-family: 'Noto Serif JP', 'serif'; font-size: 15px;">自動化システム、意思決定エンジン、生産性重視のワークフロー内で動作する。</tspan>
      </text>

      <text y="190">
        <tspan x="0">◦ I utilize TypeScript, Python, and Node.js to develop scalable</tspan>
        <tspan x="0" dy="24">backend and API-driven architectures.</tspan>
        <tspan x="0" dy="28" fill="#8b949e" opacity="0.7" style="font-family: 'Noto Serif JP', 'serif'; font-size: 15px;">TypeScript, Python, Node.js を活用し、拡張可能な構成を開発する。</tspan>
      </text>

      <text y="285">
        <tspan x="0">◦ I decompose complex problems into deterministic units and</tspan>
        <tspan x="0" dy="24">assemble modular, composable systems.</tspan>
        <tspan x="0" dy="28" fill="#8b949e" opacity="0.7" style="font-family: 'Noto Serif JP', 'serif'; font-size: 15px;">複雑な問題を決定論的単位に分解し、モジュール構成を組み立てる。</tspan>
      </text>

      <text y="380">
        <tspan x="0">◦ I prioritize clarity, efficiency, and low-entropy outcomes over</tspan>
        <tspan x="0" dy="24">unnecessary abstraction and complexity.</tspan>
        <tspan x="0" dy="28" fill="#8b949e" opacity="0.7" style="font-family: 'Noto Serif JP', 'serif'; font-size: 15px;">不必要な抽象化よりも、明快さ、効率、低エントロピーな結果を優先する。</tspan>
      </text>

      <text y="475">
        <tspan x="0">◦ I design systems to simplify workflows, reduce manual effort,</tspan>
        <tspan x="0" dy="24">and improve decision-making efficiency.</tspan>
        <tspan x="0" dy="28" fill="#8b949e" opacity="0.7" style="font-family: 'Noto Serif JP', 'serif'; font-size: 15px;">ワークフローを簡素化し、手動作業を減らし、意思決定を最適化する。</tspan>
      </text>

      <text y="570">
        <tspan x="0">◦ I continuously evolve toward building scalable, constraint-aware</tspan>
        <tspan x="0" dy="24">architectures through LLM integration.</tspan>
        <tspan x="0" dy="28" fill="#8b949e" opacity="0.7" style="font-family: 'Noto Serif JP', 'serif'; font-size: 15px;">LLM統合を通じて、制約を意識した知的な自動化構築へと進化し続ける。</tspan>
      </text>

    </g>
  </g>

</svg>
