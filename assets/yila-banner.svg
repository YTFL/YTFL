<svg width="100%" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="800" height="220" fill="#0d1117"/>

  <!-- Piano keys -->
  <rect y="180" width="800" height="40" fill="#ffffff"/>
  
  <!-- Black keys -->
  <rect x="60" y="180" width="20" height="25" fill="#000"/>
  <rect x="120" y="180" width="20" height="25" fill="#000"/>
  <rect x="200" y="180" width="20" height="25" fill="#000"/>
  <rect x="260" y="180" width="20" height="25" fill="#000"/>
  <rect x="320" y="180" width="20" height="25" fill="#000"/>
  <rect x="400" y="180" width="20" height="25" fill="#000"/>
  <rect x="460" y="180" width="20" height="25" fill="#000"/>
  <rect x="540" y="180" width="20" height="25" fill="#000"/>
  <rect x="600" y="180" width="20" height="25" fill="#000"/>

  <!-- Sakura petals -->
  <circle cx="200" cy="60" r="3" fill="#f778ba">
    <animate attributeName="cy" values="60;200" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="400" cy="40" r="3" fill="#f778ba">
    <animate attributeName="cy" values="40;200" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="600" cy="80" r="3" fill="#f778ba">
    <animate attributeName="cy" values="80;200" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Name (subtle, not dominant) -->
  <text x="50%" y="100" text-anchor="middle" fill="#58A6FF" font-size="28" font-family="monospace" opacity="0.8">
    YTFL
  </text>

</svg>
