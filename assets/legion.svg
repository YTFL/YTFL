<svg width="840" height="360" viewBox="0 0 840 360" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#050607"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Holographic glow -->
    <filter id="holoGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#7df9ff"/>
    </filter>

    <!-- Scanlines -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#7df9ff08"/>
    </pattern>

    <!-- Noise -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.03"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" filter="url(#noise)"/>
  <rect width="100%" height="100%" fill="url(#scan)"/>

  <!-- Grid -->
  <g stroke="#7df9ff12" stroke-width="1">
    <line x1="0" y1="120" x2="840" y2="120"/>
    <line x1="0" y1="240" x2="840" y2="240"/>
    <line x1="210" y1="0" x2="210" y2="360"/>
    <line x1="420" y1="0" x2="420" y2="360"/>
    <line x1="630" y1="0" x2="630" y2="360"/>
  </g>

  <style>
    text {
      font-family: monospace;
      text-anchor: middle;
      letter-spacing: 1px;
      fill: #bffcff;
    }
    .id { font-size: 10px; opacity: 0.6; }
    .name { font-size: 15px; fill: #eaffff; }
    .class { font-size: 11px; opacity: 0.75; }
  </style>

  <!-- UNIT 01 -->
  <a href="https://github.com/YTFL/AttendMate-Bunk-Calculator-Attendance-Tracker">
    <circle cx="140" cy="110" r="42" stroke="#7df9ff40" fill="none"/>
    <circle cx="140" cy="110" r="20" stroke="#7df9ff80" fill="none" stroke-dasharray="4 6"/>
    <circle cx="140" cy="110" r="3" fill="#7df9ff" filter="url(#holoGlow)"/>

    <text x="140" y="180" class="id">UNIT-01 / TRACK</text>
    <text x="140" y="200" class="name">ATTENDMATE</text>
    <text x="140" y="218" class="class">attendance state computation</text>
  </a>

  <!-- UNIT 02 -->
  <a href="https://github.com/YTFL/HonZuki-BookTracker">
    <circle cx="350" cy="90" r="40" stroke="#7df9ff40" fill="none"/>
    <line x1="330" y1="80" x2="370" y2="80" stroke="#7df9ff80"/>
    <line x1="330" y1="90" x2="370" y2="90" stroke="#7df9ff80"/>
    <line x1="330" y1="100" x2="370" y2="100" stroke="#7df9ff80"/>
    <circle cx="350" cy="90" r="2" fill="#7df9ff" filter="url(#holoGlow)"/>

    <text x="350" y="160" class="id">UNIT-02 / ARCHIVE</text>
    <text x="350" y="180" class="name">HONZUKI</text>
    <text x="350" y="198" class="class">reading progression indexing</text>
  </a>

  <!-- UNIT 03 -->
  <a href="https://github.com/YTFL/PDFark-Mode-PDF-Darkmode-Converter">
    <circle cx="560" cy="110" r="38" stroke="#7df9ff40" fill="none"/>
    <rect x="545" y="95" width="15" height="30" fill="#7df9ff80"/>
    <rect x="560" y="95" width="15" height="30" fill="none" stroke="#7df9ff80"/>
    <circle cx="560" cy="110" r="2" fill="#7df9ff" filter="url(#holoGlow)"/>

    <text x="560" y="180" class="id">UNIT-03 / TRANSFORM</text>
    <text x="560" y="200" class="name">PDFARK</text>
    <text x="560" y="218" class="class">document luminance inversion</text>
  </a>

  <!-- UNIT 04 -->
  <a href="https://github.com/YTFL/SimpliMap-K-map-Simplifier">
    <circle cx="730" cy="95" r="41" stroke="#7df9ff40" fill="none"/>
    <rect x="710" y="75" width="40" height="40" fill="none" stroke="#7df9ff80"/>
    <line x1="710" y1="95" x2="750" y2="95" stroke="#7df9ff80"/>
    <line x1="730" y1="75" x2="730" y2="115" stroke="#7df9ff80"/>
    <circle cx="730" cy="95" r="2" fill="#7df9ff" filter="url(#holoGlow)"/>

    <text x="730" y="165" class="id">UNIT-04 / LOGIC</text>
    <text x="730" y="185" class="name">SIMPLIMAP</text>
    <text x="730" y="203" class="class">boolean minimization engine</text>
  </a>

  <!-- Core -->
  <circle cx="420" cy="270" r="50" stroke="#7df9ff20" fill="none"/>
  <circle cx="420" cy="270" r="4" fill="#7df9ff" filter="url(#holoGlow)"/>

  <!-- Connections -->
  <g stroke="#7df9ff20">
    <line x1="140" y1="110" x2="420" y2="270"/>
    <line x1="350" y1="90" x2="420" y2="270"/>
    <line x1="560" y1="110" x2="420" y2="270"/>
    <line x1="730" y1="95" x2="420" y2="270"/>
  </g>

</svg>
