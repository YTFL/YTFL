<svg width="1000" height="140" viewBox="0 0 1000 140" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- soft glow -->
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#58a6ff"/>
    </filter>
  </defs>

  <!-- transparent background -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- ===== MUSICAL STAFF ===== -->
  <g stroke="#58a6ff40" stroke-width="1">
    <line x1="0" y1="40" x2="1000" y2="40"/>
    <line x1="0" y1="55" x2="1000" y2="55"/>
    <line x1="0" y1="70" x2="1000" y2="70"/>
    <line x1="0" y1="85" x2="1000" y2="85"/>
    <line x1="0" y1="100" x2="1000" y2="100"/>
  </g>

  <!-- ===== FLOATING NOTES (SUBTLE, DESYNCED) ===== -->

  <!-- note 1 -->
  <g filter="url(#glow)">
    <circle cx="200" cy="70" r="5" fill="#58a6ff">
      <animate attributeName="cy" values="70;65;70" dur="6.3s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="7.1s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <rect x="205" y="40" width="2" height="30" fill="#58a6ff"/>
  </g>

  <!-- note 2 -->
  <g filter="url(#glow)">
    <circle cx="420" cy="85" r="5" fill="#58a6ff">
      <animate attributeName="cy" values="85;80;85" dur="7.5s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="6.8s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <rect x="425" y="55" width="2" height="30" fill="#58a6ff"/>
  </g>

  <!-- note 3 -->
  <g filter="url(#glow)">
    <circle cx="650" cy="55" r="5" fill="#58a6ff">
      <animate attributeName="cy" values="55;50;55" dur="5.9s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="8.2s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <rect x="655" y="25" width="2" height="30" fill="#58a6ff"/>
  </g>

  <!-- note 4 (faint) -->
  <g opacity="0.5">
    <circle cx="850" cy="70" r="4" fill="#58a6ff">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="9s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>

</svg>
